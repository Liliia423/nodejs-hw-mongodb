tags:
  - contacts
summary: Створити новий контакт
description: Додає новий контакт для авторизованого користувача
operationId: createContact
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/NewContact.yaml'
responses:
  '201':
    description: Контакт успішно створено
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Помилка валідації даних
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: 'error'
            message:
              type: string
              example: 'Validation failed'
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: 'error'
            message:
              type: string
              example: 'Not authorized'
security:
  - bearerAuth: []
