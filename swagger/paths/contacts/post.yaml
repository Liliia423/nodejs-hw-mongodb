tags:
  - contacts
summary: Створити новий контакт
description: Додає новий контакт для авторизованого користувача
operationId: createContact
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas/NewContact.yaml'
responses:
  '201':
    description: Контакт створено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: Contact created
            data:
              $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Некоректні дані
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Validation failed
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Not authorized
security:
  - bearerAuth: []
