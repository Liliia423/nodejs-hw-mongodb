tags:
  - contacts
summary: Оновити контакт за ID
description: Оновлює контакт за ID авторизованого користувача
operationId: updateContact
parameters:
  - name: contactId
    in: path
    required: true
    description: Ідентифікатор контакту
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../../components/schemas/NewContact.yaml'
responses:
  '200':
    description: Контакт оновлено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '400':
    description: Некоректні дані
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Validation failed
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Contact not found
security:
  - bearerAuth: []
