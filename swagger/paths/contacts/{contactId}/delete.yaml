tags:
  - contacts
summary: Видалити контакт за ID
description: Видаляє контакт із бази даних
operationId: deleteContact
parameters:
  - name: contactId
    in: path
    required: true
    description: Ідентифікатор контакту
    schema:
      type: string
responses:
  '200':
    description: Контакт успішно видалено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact deleted successfully
            data:
              type: object
              example: {}
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Not authorized
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Contact not found
security:
  - bearerAuth: []
