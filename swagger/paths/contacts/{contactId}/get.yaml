tags:
  - contacts
summary: Отримати контакт за ID
operationId: getContactById
description: Отримання одного контакту за його унікальним ідентифікатором
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
responses:
  '200':
    description: Контакт знайдено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact found
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Not authorized
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Contact not found
security:
  - bearerAuth: []
