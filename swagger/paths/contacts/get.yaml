tags:
  - contacts
summary: Отримати всі контакти користувача
description: Повертає список контактів з підтримкою пагінації та фільтрації
operationId: getAllContacts
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
    description: Номер сторінки (пагінація)

  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
    description: Кількість контактів на сторінці

  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: name
    description: Поле для сортування (наприклад name, email)

  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: asc
    description: Напрям сортування (asc або desc)

  - name: type
    in: query
    required: false
    schema:
      type: string
      example: personal
    description: Тип контакту (наприклад personal, work)

  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
    description: Фільтр за улюбленими контактами

responses:
  '200':
    description: Список контактів з пагінацією
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 3
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Not authorized
security:
  - bearerAuth: []
