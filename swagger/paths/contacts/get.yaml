tags:
  - contacts
summary: Отримати всі контакти користувача
description: Повертає список контактів з підтримкою пагінації та фільтрації
operationId: getAllContacts
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
    description: Номер сторінки (пагінація)
  - name: limit
    in: query
    required: false
    schema:
      type: integer
      minimum: 1
    description: Кількість елементів на сторінці
  - name: favorite
    in: query
    required: false
    schema:
      type: boolean
    description: Фільтр за улюбленими
responses:
  '200':
    description: Список контактів
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            code:
              type: integer
              example: 200
            message:
              type: string
              example: Список контактів
            data:
              type: object
              properties:
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml'
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                total:
                  type: integer
                  example: 3

  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
security:
  - bearerAuth: []
