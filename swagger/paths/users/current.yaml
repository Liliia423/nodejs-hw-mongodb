tags:
  - auth
summary: Отримати поточного користувача
description: Повертає email і subscription поточного авторизованого користувача
operationId: getCurrentUser
responses:
  '200':
    description: Дані поточного користувача
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Current user loaded
            data:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
                subscription:
                  type: string
                  example: starter
  '401':
    description: Неавторизований запит
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/ErrorResponse.yaml'
        example:
          status: error
          message: Not authorized
security:
  - bearerAuth: []
