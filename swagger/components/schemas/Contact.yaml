type: object
required:
  - _id
  - name
  - email
  - phoneNumber
  - isFavourite
  - userId
properties:
  _id:
    type: string
  name:
    type: string
  email:
    type: string
  phoneNumber:
    type: string
  contactType:
    type: string
  isFavourite:
    type: boolean
  photo:
    type: string
  userId:
    type: string
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time

ErrorResponse:
  type: object
  properties:
    status:
      type: string
      example: error
    code:
      type: integer
      example: 401
    message:
      type: string
      example: Not authorized
